[tox]
envlist = py34, py35, py36, py37, py38, py39, py310, py311, py312, py313, py314, pypy3, docs, lint, typetest, stubtest

[testenv]
deps = -r test_requirements.txt
commands = py.test -W error {posargs}


[testenv:docs]
deps = -r docs/requirements.txt
changedir = docs
commands = sphinx-build -b html -W . _build/html


[pytest]
testpaths = tests

; TODO: get rid of flakes
[flake8]
max-line-length = 100
ignore = E127,E128,E302,F403,E126,E272,E226,E301,E261,E265,E251,E303,E305,E306,E266,E731,E402,F405,W503
exclude = docs/conf.py, .tox

[testenv:typetest]
basepython = python3.13
deps =
    pyright
    mypy
    ty
commands =
    python type_tests/run.py pyright
    python type_tests/run.py mypy
    python type_tests/run.py ty

[testenv:stubtest]
basepython = python3.13
deps =
    mypy
commands =
    python -m mypy.stubtest funcy.types funcy.strings funcy.tree funcy.colls funcy.seqs funcy.funcs funcy.funcolls funcy.flow funcy.calc funcy.debug funcy.objects funcy.decorators --mypy-config-file mypy_stubtest.ini --allowlist stubtest_allowlist.txt

[testenv:lint]
basepython = python3.10
passenv = PYTHONPATH
deps =
    flake8>=3.8.3
commands =
    python --version
    flake8 funcy
    flake8 --select=F,E5,W tests
